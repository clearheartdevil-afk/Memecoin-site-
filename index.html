<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MemeCoinSite</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
            background: linear-gradient(135deg, #111827, #4c1d95, #7c3aed);
        }

        .container {
            width: 90%;
            max-width: 600px;
            padding: 50px 30px;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.20);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        .logo {
            font-size: 65px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .subtitle {
            color: #e5e7eb;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        button {
            padding: 14px 25px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background: white;
            color: #4c1d95;
        }

        button:hover {
            opacity: 0.9;
        }

        #profile {
            display: none;
            margin-top: 25px;
        }

        #profile img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin-bottom: 15px;
        }

        .user-id {
            margin: 15px 0;
            padding: 12px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.25);
            font-weight: bold;
        }

        #status {
            margin-top: 20px;
            min-height: 24px;
            color: #d1fae5;
            font-size: 15px;
        }

        .footer {
            margin-top: 35px;
            color: #d1d5db;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">🚀</div>

    <h1>MemeCoinSite</h1>

    <p class="subtitle">
        Create your own unique digital meme collectible.
    </p>

    <button id="loginBtn">
        Sign in with Google
    </button>

    <div id="status"></div>

    <div id="profile">

        <img id="profilePhoto" src="" alt="Profile">

        <h2 id="welcome"></h2>

        <div class="user-id">
            MemeCoinSite ID:<br>
            <span id="userId"></span>
        </div>

        <button id="logoutBtn">
            Logout
        </button>

    </div>

    <div class="footer">
        © 2026 MemeCoinSite
    </div>

</div>

<script type="module">

    import { initializeApp } from
    "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
        getAuth,
        GoogleAuthProvider,
        signInWithPopup,
        signOut,
        onAuthStateChanged
    } from
    "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

    import {
        getFirestore,
        doc,
        getDoc,
        setDoc
    } from
    "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


    // Firebase configuration

    const firebaseConfig = {
        apiKey: "AIzaSyCt3Dn15Qs7KpoTroCrDbvP0wNqDluvII",
        authDomain: "memecoinsite-52a7f.firebaseapp.com",
        projectId: "memecoinsite-52a7f",
        storageBucket: "memecoinsite-52a7f.firebasestorage.app",
        messagingSenderId: "427751968898",
        appId: "1:427751968898:web:5ce1f4209e5beb4f3ce49b"
    };


    // Initialize Firebase

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);

    const provider = new GoogleAuthProvider();


    const loginBtn = document.getElementById("loginBtn");

    const logoutBtn = document.getElementById("logoutBtn");

    const profile = document.getElementById("profile");

    const status = document.getElementById("status");

    const welcome = document.getElementById("welcome");

    const userIdElement = document.getElementById("userId");

    const profilePhoto = document.getElementById("profilePhoto");


    // Generate a unique MemeCoinSite ID

    function generateMemeCoinID() {

        const randomPart =
            Math.random()
                .toString(36)
                .substring(2, 10)
                .toUpperCase();

        return "MC-" + randomPart;
    }


    // Google login

    loginBtn.addEventListener("click", async () => {

        try {

            status.textContent = "Signing in...";

            const result =
                await signInWithPopup(auth, provider);

            const user = result.user;

            const userRef =
                doc(db, "users", user.uid);

            const userSnapshot =
                await getDoc(userRef);


            let memeCoinID;


            if (userSnapshot.exists()) {

                memeCoinID =
                    userSnapshot.data().memeCoinID;

            } else {

                memeCoinID =
                    generateMemeCoinID();


                await setDoc(userRef, {

                    memeCoinID: memeCoinID,

                    uid: user.uid,

                    name: user.displayName || "",

                    email: user.email || "",

                    photoURL: user.photoURL || "",

                    createdAt: new Date().toISOString()

                });

            }


            status.textContent =
                "✅ Login successful!";

            welcome.textContent =
                "Welcome, " + (user.displayName || "User");


            userIdElement.textContent =
                memeCoinID;


            if (user.photoURL) {

                profilePhoto.src =
                    user.photoURL;

            }

            loginBtn.style.display = "none";

            profile.style.display = "block";

        } catch (error) {

            console.error(error);

            status.textContent =
                "❌ Login failed: " + error.message;

        }

    });


    // Logout

    logoutBtn.addEventListener("click", async () => {

        try {

            await signOut(auth);

            profile.style.display = "none";

            loginBtn.style.display = "inline-block";

            status.textContent =
                "You have been logged out.";

        } catch (error) {

            console.error(error);

        }

    });


    // Check login state

    onAuthStateChanged(auth, async (user) => {

        if (user) {

            const userRef =
                doc(db, "users", user.uid);

            const userSnapshot =
                await getDoc(userRef);


            if (userSnapshot.exists()) {

                const data =
                    userSnapshot.data();


                welcome.textContent =
                    "Welcome, " +
                    (user.displayName || "User");


                userIdElement.textContent =
                    data.memeCoinID;


                if (user.photoURL) {

                    profilePhoto.src =
                        user.photoURL;

                }

                loginBtn.style.display =
                    "none";

                profile.style.display =
                    "block";

            }

        }

    });

</script>

</body>
</html>
